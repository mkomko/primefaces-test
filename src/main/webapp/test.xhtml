<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <h:head>
        <title>PrimeFaces Test</title>
        <h:outputScript name="test.js" />
        <h:outputStylesheet name="test.css" />
    </h:head>
    <h:body>

        <h1>#{testView.string}</h1>
        <h:form id="frmTest">
            <!-- WORKS: literal oncomplete -> onco: present in generated script -->
            <p:remoteCommand name="cmdLiteral"
                             action="#{testView.testMethod}"
                             oncomplete="console.log('literal oncomplete');"/>

            <!-- BUG: literal + EL in oncomplete -> onco: MISSING in generated script -->
            <p:remoteCommand name="cmdLiteralPlusEl"
                             action="#{testView.testMethod}"
                             oncomplete="console.log('literal part'); #{testView.completeScript}"/>
        </h:form>

    </h:body>
</html>
